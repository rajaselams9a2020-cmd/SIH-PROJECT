services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: varuna-agro-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # 2. React Vite Frontend Static Site
  - type: web
    name: varuna-agro-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: varuna-agro-backend
          property: host
